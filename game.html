<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #05060f; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position: relative; width: min(96vmin, 760px); }
  canvas { display: block; width: 100%; aspect-ratio: 1 / 1; background: #070818;
           border: 2px solid #1b2b52; border-radius: 12px;
           box-shadow: 0 0 42px rgba(0, 255, 190, 0.22), 0 0 90px rgba(120, 60, 255, 0.18); }
  #hud { display: flex; justify-content: space-between; align-items: baseline;
         color: #e8f6ff; padding: 10px 4px 12px; font-size: 20px; letter-spacing: 1px; }
  #hud b { color: #00ffc2; font-size: 26px; }
  #hud .best { color: #8b93b8; font-size: 15px; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; text-align: center;
             color: #e8f6ff; background: rgba(5, 6, 15, 0.72); border-radius: 12px; }
  #overlay h1 { margin: 0 0 8px; font-size: 44px; letter-spacing: 4px; color: #00ffc2;
                text-shadow: 0 0 24px rgba(0, 255, 194, 0.8); }
  #overlay p { margin: 6px 0; font-size: 18px; color: #b9c4e8; }
  #overlay .score { font-size: 30px; color: #fff; }
  #overlay .keys { font-size: 15px; color: #7d86ad; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>SCORE <b id="score">0</b></span><span class="best" id="best"></span></div>
  <canvas id="game" width="640" height="640"></canvas>
  <div id="overlay">
    <h1 id="title">NEON SNAKE</h1>
    <p id="line1">Arrow keys to steer. Eat the glowing food to grow.</p>
    <p id="line2">Every bite makes you faster.</p>
    <p class="score hidden" id="finalScore"></p>
    <p class="keys" id="hint">Press any arrow key to play</p>
  </div>
</div>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var titleEl = document.getElementById("title");
  var line1 = document.getElementById("line1");
  var line2 = document.getElementById("line2");
  var finalScore = document.getElementById("finalScore");
  var hint = document.getElementById("hint");

  var CELL = 32;                 // 20 x 20 grid on a 640px canvas
  var COLS = canvas.width / CELL;
  var ROWS = canvas.height / CELL;
  var START_SPEED = 150;         // ms per step
  var MIN_SPEED = 62;            // fastest step, reached after many bites
  var SPEED_STEP = 6;            // ms faster per food eaten

  var snake, dir, pendingDir, food, score, best, alive, started, timer, stepMs, pulse;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    pendingDir = dir;
    score = 0;
    stepMs = START_SPEED;
    alive = true;
    started = false;
    pulse = 0;
    placeFood();
    draw();
    updateHud();
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < COLS; x++) {
      for (var y = 0; y < ROWS; y++) {
        var onSnake = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { onSnake = true; break; }
        }
        if (!onSnake) free.push({ x: x, y: y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best > 0 ? "BEST " + best : "";
  }

  function gameOver() {
    alive = false;
    clearTimeout(timer);
    if (score > best) { best = score; try { localStorage.setItem("neon-snake-best", String(best)); } catch (e) {} }
    updateHud();
    titleEl.textContent = "GAME OVER";
    titleEl.style.color = "#ff4d6d";
    titleEl.style.textShadow = "0 0 24px rgba(255, 77, 109, 0.8)";
    line1.textContent = "You ran into trouble out there.";
    line2.textContent = "";
    finalScore.textContent = "Score: " + score;
    finalScore.classList.remove("hidden");
    hint.textContent = "Press R to restart";
    overlay.classList.remove("hidden");
  }

  function start() {
    if (started) return;
    started = true;
    overlay.classList.add("hidden");
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(step, stepMs);
  }

  function step() {
    if (!alive) return;
    dir = pendingDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) { gameOver(); return; }
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) { gameOver(); return; }
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      stepMs = Math.max(MIN_SPEED, stepMs - SPEED_STEP);
      placeFood();
      updateHud();
    } else {
      snake.pop();
    }
    draw();
    schedule();
  }

  function draw() {
    pulse += 0.12;
    // dark grid
    ctx.fillStyle = "#070818";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(38, 58, 110, 0.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var g = 1; g < COLS; g++) {
      ctx.moveTo(g * CELL + 0.5, 0); ctx.lineTo(g * CELL + 0.5, canvas.height);
      ctx.moveTo(0, g * CELL + 0.5); ctx.lineTo(canvas.width, g * CELL + 0.5);
    }
    ctx.stroke();
    // glowing food
    var fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    var glow = 10 + Math.sin(pulse) * 4;
    var grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, glow + 12);
    grad.addColorStop(0, "rgba(255, 214, 64, 0.95)");
    grad.addColorStop(0.45, "rgba(255, 170, 0, 0.55)");
    grad.addColorStop(1, "rgba(255, 170, 0, 0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(fx, fy, glow + 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd640";
    ctx.beginPath(); ctx.arc(fx, fy, 8, 0, Math.PI * 2); ctx.fill();
    // snake: neon gradient from head to tail
    for (var i = snake.length - 1; i >= 0; i--) {
      var seg = snake[i];
      var t = i / Math.max(1, snake.length - 1);
      var r = Math.round(0 + t * 120), gg = Math.round(255 - t * 120), b = Math.round(194 - t * 60);
      ctx.fillStyle = "rgb(" + r + "," + gg + "," + b + ")";
      ctx.shadowColor = "rgba(0, 255, 190, 0.9)";
      ctx.shadowBlur = i === 0 ? 22 : 12;
      var pad = i === 0 ? 3 : 5;
      var x = seg.x * CELL + pad, y = seg.y * CELL + pad, s = CELL - pad * 2;
      ctx.beginPath();
      ctx.roundRect(x, y, s, s, 7);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    // eyes on the head
    var hx = snake[0].x * CELL, hy = snake[0].y * CELL;
    ctx.fillStyle = "#05060f";
    var ex = dir.x, ey = dir.y;
    var cx = hx + CELL / 2 + ex * 6, cy = hy + CELL / 2 + ey * 6;
    var px = -ey, py = ex;
    ctx.beginPath(); ctx.arc(cx + px * 7, cy + py * 7, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - px * 7, cy - py * 7, 3.4, 0, Math.PI * 2); ctx.fill();
  }

  var KEYS = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
               ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 } };

  document.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R") {
      if (!alive) {
        titleEl.textContent = "NEON SNAKE";
        titleEl.style.color = "#00ffc2";
        titleEl.style.textShadow = "0 0 24px rgba(0, 255, 194, 0.8)";
        line1.textContent = "Arrow keys to steer. Eat the glowing food to grow.";
        line2.textContent = "Every bite makes you faster.";
        finalScore.classList.add("hidden");
        hint.textContent = "Press any arrow key to play";
        reset();
      }
      return;
    }
    var next = KEYS[e.key];
    if (!next) return;
    e.preventDefault();
    // no reversing into yourself
    if (next.x === -dir.x && next.y === -dir.y) return;
    pendingDir = next;
    start();
  });

  try { best = parseInt(localStorage.getItem("neon-snake-best") || "0", 10) || 0; }
  catch (e) { best = 0; }
  // debug hook for scripted capture only: lets a test driver read state
  window.__game = {
    get snake() { return snake; },
    get food() { return food; },
    get score() { return score; },
    get alive() { return alive; },
    get dir() { return dir; }
  };
  reset();
})();
</script>
</body>
</html>
